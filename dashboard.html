<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mijn Dashboard"/>
  <meta name="theme-color" content="#0f0f14"/>
  <title>Mijn Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0f0f14;
      --surface:   #18181f;
      --border:    #26263a;
      --text:      #f0f0f0;
      --muted:     #6b6b80;
      --accent:    #6366f1;
      --accent2:   #8b5cf6;
      --green:     #10b981;
      --amber:     #f59e0b;
      --pink:      #ec4899;
      --red:       #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 16px; overflow: hidden; }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100dvh; }
    #header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      flex-shrink: 0;
    }
    #header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #header .subtitle { font-size: 12px; color: var(--muted); margin-top: 1px; }

    #content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px 0; }
    #content::-webkit-scrollbar { display: none; }

    /* ── Bottom nav ── */
    #nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding-bottom: var(--safe-bottom);
      flex-shrink: 0;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 0 8px;
      border: none; background: none; color: var(--muted);
      font-family: inherit; font-size: 10px; font-weight: 600;
      letter-spacing: .3px; cursor: pointer; transition: color .15s;
    }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn.active svg { filter: drop-shadow(0 0 6px rgba(99,102,241,.5)); }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .card-row { display: flex; align-items: center; gap: 12px; }

    /* ── Stat grid ── */
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 10px; text-align: center;
    }
    .stat-num { font-size: 24px; font-weight: 700; line-height: 1; }
    .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .prog { height: 4px; background: #222; border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 2px; transition: width .4s; }

    /* ── Buttons ── */
    .btn { border: none; border-radius: 10px; font-family: inherit; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s; }
    .btn:active { opacity: .7; }
    .btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; padding: 11px 16px; font-size: 14px; }
    .btn-sm { background: var(--border); color: var(--text); padding: 8px 12px; font-size: 13px; }
    .btn-icon { background: none; color: var(--muted); padding: 6px; border-radius: 8px; }
    .btn-icon:active { background: #222; }
    .fab {
      position: fixed; bottom: calc(80px + var(--safe-bottom)); right: 16px;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; font-size: 26px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(99,102,241,.45);
      cursor: pointer; transition: transform .15s;
    }
    .fab:active { transform: scale(.92); }

    /* ── Inputs ── */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    input[type=text], input[type=number], input[type=date], select, textarea {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 10px; color: var(--text); padding: 12px 14px;
      font-family: inherit; font-size: 15px; outline: none;
      -webkit-appearance: none; appearance: none;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); }

    /* ── Checkbox ── */
    .cb {
      width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .2s;
    }
    .cb.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; }
    .cb svg { display: none; }
    .cb.on svg { display: block; }

    /* ── List items ── */
    .list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px;
    }
    .list-item .title { font-size: 15px; flex: 1; }
    .list-item.done .title { text-decoration: line-through; color: var(--muted); }
    .list-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── Pill filter ── */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; overflow-x: auto; }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: none; color: var(--muted); font-family: inherit;
      font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: all .15s;
    }
    .pill.on { border-color: var(--accent); color: #a5b4fc; background: rgba(99,102,241,.1); }

    /* ── Modal sheet ── */
    .sheet-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: flex-end;
      z-index: 100; animation: bgIn .2s ease;
    }
    @keyframes bgIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      background: var(--surface); border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(20px + var(--safe-bottom));
      width: 100%; max-height: 90dvh; overflow-y: auto;
      animation: sheetIn .25s ease;
    }
    @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
    .sheet h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }

    /* ── Period badge ── */
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: .4px;
    }

    /* ── Sub tabs ── */
    .subtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      background: var(--bg); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .subtab {
      padding: 10px; border-radius: 9px; border: none;
      background: none; color: var(--muted); font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all .2s;
    }
    .subtab.on { background: var(--surface); color: var(--text); }
    .subtab svg { width: 16px; height: 16px; }

    /* ── Color swatches ── */
    .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: border-color .15s;
    }
    .swatch.on { border-color: #fff; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
    .empty svg { opacity: .3; margin-bottom: 10px; }

    /* ── Section header ── */
    .sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .sec-hdr h2 { font-size: 15px; font-weight: 700; }

    /* ── Project progress ── */
    .proj-prog { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 10px; }

    /* ── Phase list ── */
    .phase {
      display: flex; align-items: center; gap: 10px;
      padding: 14px; background: var(--bg);
      border-radius: 10px; margin-bottom: 6px;
    }
    .phase.done .phase-lbl { text-decoration: line-through; color: var(--muted); }
    .phase-lbl { flex: 1; font-size: 15px; }
    .phase-num { font-size: 11px; color: var(--muted); }

    .fade { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* two-col grid for small numbers */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .two-card { background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; text-align: center; }
    .two-num { font-size: 28px; font-weight: 700; line-height: 1; }
    .two-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* macro row */
    .macro-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
    .macro { background: var(--bg); border-radius: 8px; padding: 8px; text-align: center; }
    .macro .mn { font-size: 15px; font-weight: 700; }
    .macro .ml { font-size: 10px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>Mijn Dashboard</h1>
    <div class="subtitle" id="hdr-date"></div>
  </div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-btn active" data-tab="goals" onclick="switchTab('goals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      Doelen
    </button>
    <button class="nav-btn" data-tab="sport" onclick="switchTab('sport')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M7 6.5v11M17 6.5v11"/></svg>
      Sporten
    </button>
    <button class="nav-btn" data-tab="projects" onclick="switchTab('projects')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Projecten
    </button>
  </nav>
</div>

<!-- Sheet overlay -->
<div id="sheet-bg" class="sheet-bg" style="display:none" onclick="closeSheet(event)">
  <div class="sheet" id="sheet-body">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<script>
// ─── Storage ─────────────────────────────────────────────────────────────────
const DB = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v))
};

// ─── State ───────────────────────────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const todayStr = () => new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
const todayISO = () => new Date().toISOString().split('T')[0];
const PCOLORS = ['#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#8b5cf6','#14b8a6'];

let state = {
  tab: 'goals',
  sportSub: 'sport',
  goalFilter: 'alle',
  openProject: null,
  goals: DB.get('goals') ?? [
    {id:uid(),text:'30 minuten lezen',period:'dag',done:false},
    {id:uid(),text:'10.000 stappen',period:'dag',done:false},
    {id:uid(),text:'3x sporten',period:'week',done:false},
    {id:uid(),text:'Nieuw boek uitlezen',period:'maand',done:false},
  ],
  workouts: DB.get('workouts') ?? [],
  meals: DB.get('meals') ?? [],
  projects: DB.get('projects') ?? [
    {id:uid(),title:'Portfolio website',color:'#6366f1',phases:[
      {id:uid(),label:'Ontwerp maken',done:true},
      {id:uid(),label:'HTML/CSS opzetten',done:true},
      {id:uid(),label:'Content schrijven',done:false},
      {id:uid(),label:'Publiceren',done:false},
    ]}
  ],
};

const save = () => {
  DB.set('goals', state.goals);
  DB.set('workouts', state.workouts);
  DB.set('meals', state.meals);
  DB.set('projects', state.projects);
};

// ─── Icons ───────────────────────────────────────────────────────────────────
const I = {
  plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  trash: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
  back: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  fire: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>`,
  apple: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75.86 3.5 1.06 3 .5 5.5-2.56 5.5-6 0-5-3.5-9.56-7-9.56s-7 4.56-7 9.56c0 3.44 2.5 6.5 5.5 6 .75-.2 2-.56 3.5-.56v-.5"/><path d="M10 2c0 2-2 3-2 5"/></svg>`,
};

// ─── Render ───────────────────────────────────────────────────────────────────
document.getElementById('hdr-date').textContent = todayStr();

function render() {
  const c = document.getElementById('content');
  if (state.tab === 'goals')    c.innerHTML = renderGoals();
  if (state.tab === 'sport')    c.innerHTML = renderSport();
  if (state.tab === 'projects') c.innerHTML = renderProjects();
}

// ─── TAB: GOALS ───────────────────────────────────────────────────────────────
const pColor = {dag:'#f59e0b',week:'#10b981',maand:'#6366f1'};
const pLabel = {dag:'Dag',week:'Week',maand:'Maand'};
const pLong  = {dag:'Vandaag',week:'Deze week',maand:'Deze maand'};

function renderGoals() {
  const {goals, goalFilter} = state;
  const g = goalFilter === 'alle' ? goals : goals.filter(x=>x.period===goalFilter);

  // stat cards
  let stats = ['dag','week','maand'].map(p => {
    const it = goals.filter(x=>x.period===p);
    const d = it.filter(x=>x.done).length;
    const pct = it.length ? Math.round(d/it.length*100) : 0;
    return `<div class="stat-card">
      <div class="stat-num" style="color:${pColor[p]}">${d}/${it.length}</div>
      <div class="stat-lbl">${pLabel[p]}</div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%;background:${pColor[p]}"></div></div>
    </div>`;
  }).join('');

  // pills
  const pills = ['alle','dag','week','maand'].map(f =>
    `<button class="pill ${goalFilter===f?'on':''}" onclick="setGoalFilter('${f}')">${f==='alle'?'Alle':pLong[f]}</button>`
  ).join('');

  // items
  let items = '';
  if (g.length === 0) {
    items = `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><div>Geen doelen gevonden</div></div>`;
  } else {
    items = g.map(gl => `
      <div class="list-item ${gl.done?'done':''} fade">
        <div class="cb ${gl.done?'on':''}" onclick="toggleGoal('${gl.id}')">
          ${I.check}
        </div>
        <div style="flex:1">
          <div class="title">${esc(gl.text)}</div>
          <div class="meta">
            <span class="badge" style="background:${pColor[gl.period]}22;color:${pColor[gl.period]}">${pLabel[gl.period]}</span>
          </div>
        </div>
        <button class="btn btn-icon" onclick="deleteGoal('${gl.id}')">${I.trash}</button>
      </div>`).join('');
  }

  return `
    <div class="stat-grid">${stats}</div>
    <div class="pills">${pills}</div>
    <div id="goals-list">${items}</div>
    <div style="height:80px"></div>
    <button class="fab" onclick="openAddGoal()">${I.plus}</button>`;
}

function setGoalFilter(f) { state.goalFilter = f; render(); }
function toggleGoal(id) {
  state.goals = state.goals.map(g => g.id===id ? {...g,done:!g.done} : g);
  save(); render();
}
function deleteGoal(id) {
  if(!confirm('Doel verwijderen?')) return;
  state.goals = state.goals.filter(g => g.id!==id);
  save(); render();
}

function openAddGoal() {
  showSheet(`<h2>Nieuw doel</h2>
    <div class="field"><label>Omschrijving</label>
      <input type="text" id="gl-text" placeholder="Wat wil je bereiken?" autofocus/></div>
    <div class="field"><label>Periode</label>
      <select id="gl-period">
        <option value="dag">Dag</option>
        <option value="week">Week</option>
        <option value="maand">Maand</option>
      </select></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:4px" onclick="saveGoal()">Opslaan</button>`);
}
function saveGoal() {
  const text = document.getElementById('gl-text').value.trim();
  const period = document.getElementById('gl-period').value;
  if (!text) return;
  state.goals.push({id:uid(),text,period,done:false});
  save(); closeSheet(); render();
}

// ─── TAB: SPORT ───────────────────────────────────────────────────────────────
function renderSport() {
  const sub = state.sportSub;
  const subtabs = `<div class="subtabs">
    <button class="subtab ${sub==='sport'?'on':''}" onclick="setSportSub('sport')">
      ${I.fire} Workouts
    </button>
    <button class="subtab ${sub==='food'?'on':''}" onclick="setSportSub('food')">
      ${I.apple} Voeding
    </button>
  </div>`;

  if (sub === 'sport') return subtabs + renderWorkouts();
  return subtabs + renderFood();
}

function setSportSub(s) { state.sportSub = s; render(); }

function renderWorkouts() {
  const {workouts} = state;
  const tod = workouts.filter(w=>w.date===todayISO());
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay()+1);
  const weekStr = weekStart.toISOString().split('T')[0];
  const wk = workouts.filter(w=>w.date>=weekStr);

  const stats = `<div class="two-col">
    <div class="two-card"><div class="two-num" style="color:#f59e0b">${tod.length}</div><div class="two-lbl">Vandaag</div></div>
    <div class="two-card"><div class="two-num" style="color:#10b981">${wk.length}</div><div class="two-lbl">Deze week</div></div>
  </div>`;

  const items = workouts.length === 0
    ? `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M7 6.5v11M17 6.5v11"/></svg><div>Nog geen workouts gelogd</div></div>`
    : [...workouts].reverse().map(w => `
      <div class="list-item fade">
        <div style="background:#f59e0b18;border-radius:10px;padding:9px;flex-shrink:0">${I.fire}</div>
        <div style="flex:1">
          <div class="title">${esc(w.type)}</div>
          <div class="meta">${w.date}${w.duration?' · '+w.duration+' min':''}${w.notes?' · '+esc(w.notes):''}</div>
        </div>
        <button class="btn btn-icon" onclick="deleteWorkout('${w.id}')">${I.trash}</button>
      </div>`).join('');

  return `${stats}
    <div class="sec-hdr"><h2>Workout log</h2></div>
    ${items}
    <div style="height:80px"></div>
    <button class="fab" onclick="openAddWorkout()">${I.plus}</button>`;
}

function deleteWorkout(id) {
  if(!confirm('Workout verwijderen?')) return;
  state.workouts = state.workouts.filter(w=>w.id!==id);
  save(); render();
}
function openAddWorkout() {
  showSheet(`<h2>Workout loggen</h2>
    <div class="field"><label>Activiteit</label>
      <input type="text" id="w-type" placeholder="bijv. Hardlopen, Krachttraining…" autofocus/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Datum</label><input type="date" id="w-date" value="${todayISO()}"/></div>
      <div class="field"><label>Duur (min)</label><input type="number" id="w-dur" placeholder="45"/></div>
    </div>
    <div class="field"><label>Notities</label><input type="text" id="w-notes" placeholder="bijv. 5km in 25 min"/></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:4px" onclick="saveWorkout()">Opslaan</button>`);
}
function saveWorkout() {
  const type = document.getElementById('w-type').value.trim();
  if (!type) return;
  state.workouts.push({id:uid(),type,date:document.getElementById('w-date').value,duration:document.getElementById('w-dur').value,notes:document.getElementById('w-notes').value.trim()});
  save(); closeSheet(); render();
}

function renderFood() {
  const {meals} = state;
  const tod = meals.filter(m=>m.date===todayISO());
  const cal = tod.reduce((a,m)=>a+(+m.calories||0),0);
  const prot = tod.reduce((a,m)=>a+(+m.protein||0),0);
  const carbs = tod.reduce((a,m)=>a+(+m.carbs||0),0);
  const fat = tod.reduce((a,m)=>a+(+m.fat||0),0);

  const stats = `<div class="card" style="margin-bottom:16px">
    <div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Vandaag</div>
    <div class="macro-row">
      <div class="macro"><div class="mn" style="color:#ec4899">${cal}</div><div class="ml">kcal</div></div>
      <div class="macro"><div class="mn" style="color:#6366f1">${prot}g</div><div class="ml">eiwit</div></div>
      <div class="macro"><div class="mn" style="color:#f59e0b">${carbs}g</div><div class="ml">koolh.</div></div>
      <div class="macro"><div class="mn" style="color:#10b981">${fat}g</div><div class="ml">vet</div></div>
    </div>
  </div>`;

  const items = meals.length === 0
    ? `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><div>Nog geen maaltijden gelogd</div></div>`
    : [...meals].reverse().map(m => `
      <div class="list-item fade">
        <div style="background:#ec489918;border-radius:10px;padding:9px;flex-shrink:0">${I.apple}</div>
        <div style="flex:1">
          <div class="title">${esc(m.meal)}</div>
          <div class="meta">${m.date}${m.calories?' · '+m.calories+' kcal':''}${m.protein?' · '+m.protein+'g eiwit':''}</div>
        </div>
        <button class="btn btn-icon" onclick="deleteMeal('${m.id}')">${I.trash}</button>
      </div>`).join('');

  return `${stats}
    <div class="sec-hdr"><h2>Voedingslog</h2></div>
    ${items}
    <div style="height:80px"></div>
    <button class="fab" onclick="openAddMeal()">${I.plus}</button>`;
}

function deleteMeal(id) {
  if(!confirm('Maaltijd verwijderen?')) return;
  state.meals = state.meals.filter(m=>m.id!==id);
  save(); render();
}
function openAddMeal() {
  showSheet(`<h2>Maaltijd loggen</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Maaltijd</label><input type="text" id="m-meal" placeholder="Ontbijt, lunch…" autofocus/></div>
      <div class="field"><label>Datum</label><input type="date" id="m-date" value="${todayISO()}"/></div>
    </div>
    <div class="macro-row" style="gap:10px;margin-bottom:12px">
      <div class="field" style="margin:0"><label>Calorieën</label><input type="number" id="m-cal" placeholder="0"/></div>
      <div class="field" style="margin:0"><label>Eiwit (g)</label><input type="number" id="m-prot" placeholder="0"/></div>
      <div class="field" style="margin:0"><label>Koolh. (g)</label><input type="number" id="m-carbs" placeholder="0"/></div>
      <div class="field" style="margin:0"><label>Vet (g)</label><input type="number" id="m-fat" placeholder="0"/></div>
    </div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:4px" onclick="saveMeal()">Opslaan</button>`);
}
function saveMeal() {
  const meal = document.getElementById('m-meal').value.trim();
  if (!meal) return;
  state.meals.push({id:uid(),meal,date:document.getElementById('m-date').value,
    calories:document.getElementById('m-cal').value,
    protein:document.getElementById('m-prot').value,
    carbs:document.getElementById('m-carbs').value,
    fat:document.getElementById('m-fat').value});
  save(); closeSheet(); render();
}

// ─── TAB: PROJECTS ────────────────────────────────────────────────────────────
function renderProjects() {
  const {projects, openProject} = state;
  if (openProject) {
    const p = projects.find(x=>x.id===openProject);
    if (!p) { state.openProject=null; return renderProjects(); }
    const done = p.phases.filter(ph=>ph.done).length;
    const pct = p.phases.length ? Math.round(done/p.phases.length*100) : 0;

    const phases = p.phases.length === 0
      ? `<div class="empty" style="padding:24px 0"><div>Voeg je eerste fase toe</div></div>`
      : p.phases.map((ph,i) => `
        <div class="phase ${ph.done?'done':''} fade">
          <div class="cb ${ph.done?'on':''}" style="border-color:${ph.done?p.color:'var(--border)'};background:${ph.done?p.color+'33':'transparent'}" onclick="togglePhase('${p.id}','${ph.id}')">
            ${I.check}
          </div>
          <span class="phase-lbl">${esc(ph.label)}</span>
          <span class="phase-num">Fase ${i+1}</span>
          <button class="btn btn-icon" onclick="deletePhase('${p.id}','${ph.id}')">${I.trash}</button>
        </div>`).join('');

    return `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <button class="btn btn-icon" style="padding:8px" onclick="closeProject()">${I.back}</button>
        <div style="width:12px;height:12px;border-radius:50%;background:${p.color};flex-shrink:0"></div>
        <h2 style="font-size:17px;font-weight:700;flex:1">${esc(p.title)}</h2>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:13px;color:var(--muted)">Voortgang</span>
          <span style="font-size:13px;font-weight:700;color:${p.color}">${done}/${p.phases.length} fases · ${pct}%</span>
        </div>
        <div class="proj-prog"><div style="height:100%;width:${pct}%;background:${p.color};border-radius:3px;transition:width .4s"></div></div>
      </div>
      ${phases}
      <div style="height:80px"></div>
      <button class="fab" onclick="openAddPhase('${p.id}')">${I.plus}</button>`;
  }

  // project list
  const list = projects.length === 0
    ? `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><div>Nog geen projecten</div></div>`
    : projects.map(p => {
        const done = p.phases.filter(ph=>ph.done).length;
        const pct = p.phases.length ? Math.round(done/p.phases.length*100) : 0;
        return `<div class="card" style="border-left:3px solid ${p.color};cursor:pointer" onclick="openProjectView('${p.id}')">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <div style="flex:1;font-size:15px;font-weight:600">${esc(p.title)}</div>
            <span style="font-size:12px;color:var(--muted)">${done}/${p.phases.length}</span>
            <button class="btn btn-icon" onclick="event.stopPropagation();deleteProject('${p.id}')">${I.trash}</button>
          </div>
          <div class="proj-prog"><div style="height:100%;width:${pct}%;background:${p.color};border-radius:3px;transition:width .4s"></div></div>
          ${p.phases.length?`<div style="font-size:11px;color:var(--muted);margin-top:6px">${pct}% voltooid</div>`:''}
        </div>`;
      }).join('');

  return `
    <div class="sec-hdr"><h2>Projecten (${projects.length})</h2></div>
    ${list}
    <div style="height:80px"></div>
    <button class="fab" onclick="openAddProject()">${I.plus}</button>`;
}

function openProjectView(id) { state.openProject = id; render(); }
function closeProject() { state.openProject = null; render(); }

function deleteProject(id) {
  if(!confirm('Project verwijderen?')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  if(state.openProject===id) state.openProject=null;
  save(); render();
}
function openAddProject() {
  const swatches = PCOLORS.map(c=>
    `<div class="swatch on" data-c="${c}" style="background:${c}" onclick="selectSwatch(this,'${c}')"></div>`
  ).join('');
  showSheet(`<h2>Nieuw project</h2>
    <div class="field"><label>Naam</label><input type="text" id="p-title" placeholder="bijv. Portfolio website" autofocus/></div>
    <div class="field"><label>Kleur</label><div class="swatches" id="swatches">${swatches}</div></div>
    <input type="hidden" id="p-color" value="${PCOLORS[0]}"/>
    <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:4px" onclick="saveProject()">Aanmaken</button>`);
  // deselect all but first
  setTimeout(()=>{
    document.querySelectorAll('.swatch').forEach((s,i)=>{ if(i!==0) s.classList.remove('on'); });
  },10);
}
function selectSwatch(el, c) {
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('p-color').value = c;
}
function saveProject() {
  const title = document.getElementById('p-title').value.trim();
  const color = document.getElementById('p-color').value;
  if (!title) return;
  const p = {id:uid(),title,color,phases:[]};
  state.projects.push(p);
  state.openProject = p.id;
  save(); closeSheet(); render();
}

function togglePhase(projId, phId) {
  state.projects = state.projects.map(p => p.id!==projId ? p : {
    ...p, phases: p.phases.map(ph => ph.id!==phId ? ph : {...ph,done:!ph.done})
  });
  save(); render();
}
function deletePhase(projId, phId) {
  if(!confirm('Fase verwijderen?')) return;
  state.projects = state.projects.map(p => p.id!==projId ? p : {
    ...p, phases: p.phases.filter(ph=>ph.id!==phId)
  });
  save(); render();
}
function openAddPhase(projId) {
  showSheet(`<h2>Fase toevoegen</h2>
    <div class="field"><label>Omschrijving</label>
      <input type="text" id="ph-label" placeholder="bijv. Ontwerp maken" autofocus/></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:4px" onclick="savePhase('${projId}')">Toevoegen</button>`);
}
function savePhase(projId) {
  const label = document.getElementById('ph-label').value.trim();
  if (!label) return;
  state.projects = state.projects.map(p => p.id!==projId ? p : {
    ...p, phases:[...p.phases,{id:uid(),label,done:false}]
  });
  save(); closeSheet(); render();
}

// ─── Nav ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  state.tab = tab;
  state.openProject = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

// ─── Sheet ───────────────────────────────────────────────────────────────────
function showSheet(html) {
  document.getElementById('sheet-content').innerHTML = html;
  document.getElementById('sheet-bg').style.display = 'flex';
  setTimeout(()=>{ const f=document.querySelector('.sheet input'); if(f) f.focus(); },100);
}
function closeSheet(e) {
  if (e && e.target !== document.getElementById('sheet-bg')) return;
  document.getElementById('sheet-bg').style.display = 'none';
}
window.closeSheet = () => { document.getElementById('sheet-bg').style.display = 'none'; };

// ─── Keyboard: Enter to save ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') window.closeSheet();
});

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── PWA Service Worker ───────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE = 'dashboard-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/dashboard.html'])));
    });
    self.addEventListener('fetch', e => {
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([sw], {type:'application/javascript'});
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
